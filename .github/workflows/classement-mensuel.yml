# Travaux IA mensuels (Mistral), calés sur la remise à zéro du budget de
# l'API le 1er du mois, dans l'ordre de priorité :
#   1. résumés des dossiers (textes officiels) : contenu principal des
#      pages, rattrape le retard que l'ingestion hebdomadaire n'a pas
#      fini ;
#   2. classement des amendements votés pas encore classés, avec le
#      budget restant.
# Chaque job s'arrête proprement si le budget est épuisé ou avant la
# limite de 6 h d'un job ; la suite reprend au lancement suivant.
# Secrets requis : DATABASE_URL (URL Neon directe), MISTRAL_API_KEY,
# REVALIDATE_SECRET.
name: IA mensuelle (résumés puis amendements)

on:
  schedule:
    # Le 1er du mois, 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

# Même groupe que l'ingestion : jamais les deux en même temps.
concurrency:
  group: ingest-open-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
  SITE_URL: https://www.phronesis-france.com

jobs:
  resumes:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check secrets
        run: |
          for nom in DATABASE_URL MISTRAL_API_KEY REVALIDATE_SECRET; do
            if [ -z "${!nom}" ]; then
              echo "::error::Secret $nom manquant (gh secret set $nom)."
              exit 1
            fi
          done

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          umask 077
          printf 'DATABASE_URL=%s\nMISTRAL_API_KEY=%s\n' \
            "$DATABASE_URL" "$MISTRAL_API_KEY" > .env

      - name: Migrate
        run: pnpm db:migrate

      # Arrêt volontaire à 320 min pour laisser le temps d'écrire le
      # dernier résumé et de vider le cache avant la limite du job.
      - name: Résumés IA
        run: pnpm resumes:generate --limit=100000 --duree-max=320

      - name: Refresh site cache
        if: always()
        run: |
          curl --fail-with-body -sS --retry 3 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate"

  classer:
    needs: resumes
    # Le classement passe même si les résumés ont échoué.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          umask 077
          printf 'DATABASE_URL=%s\nMISTRAL_API_KEY=%s\n' \
            "$DATABASE_URL" "$MISTRAL_API_KEY" > .env

      # Arrêt volontaire à 320 min pour laisser le temps d'écrire le
      # dernier lot et de vider le cache avant la limite du job.
      - name: Classer
        run: pnpm amendements:classer --duree-max=320

      - name: Refresh site cache
        if: always()
        run: |
          curl --fail-with-body -sS --retry 3 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate"
