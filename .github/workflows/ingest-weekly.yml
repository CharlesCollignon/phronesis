# Ingestion hebdomadaire des dumps open data (AN + Sénat) vers Neon.
# Secrets requis : DATABASE_URL = URL Neon DIRECTE (sans -pooler),
# REVALIDATE_SECRET = même valeur que la variable Vercel du même nom.
name: Ingest open data (weekly)

on:
  schedule:
    # Lundi 04:00 UTC (06:00 Paris en hiver, 05:00 en été).
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ingest-open-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INGEST_FORCE: "1"
      # Les dumps AN/Sénat sont volumineux (votes AN en mémoire,
      # dosleg.sql ~126 Mo) : au-delà du cap heap par défaut (~4 Go).
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL manquant."
            echo "Ajouter l'URL Neon DIRECTE (sans -pooler) :"
            echo "  gh secret set DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "::warning::DATABASE_URL semble être l'URL pooler. Préférer l'URL directe pour les batchs."
              ;;
          esac

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          umask 077
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Migrate
        run: pnpm db:migrate

      - name: Ingest
        run: pnpm ingest

      # Les pages lisent la base via un cache sans expiration courte :
      # on le vide une fois les nouvelles données en base.
      - name: Refresh site cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://phronesis-seven-neon.vercel.app
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::Secret REVALIDATE_SECRET manquant : le site garde les anciennes données."
            exit 1
          fi
          curl --fail-with-body -sS --retry 3 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$SITE_URL/api/revalidate"
