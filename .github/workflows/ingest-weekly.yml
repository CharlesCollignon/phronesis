# Ingestion hebdomadaire des dumps open data (AN + Sénat) vers Neon.
# Secret requis : DATABASE_URL = URL Neon DIRECTE (sans -pooler).
name: Ingest open data (weekly)

on:
  schedule:
    # Lundi 04:00 UTC (06:00 Paris en hiver, 05:00 en été).
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ingest-open-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INGEST_FORCE: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL manquant."
            echo "Ajouter l'URL Neon DIRECTE (sans -pooler) :"
            echo "  gh secret set DATABASE_URL"
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler*)
              echo "::warning::DATABASE_URL semble être l'URL pooler. Préférer l'URL directe pour les batchs."
              ;;
          esac

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: |
          umask 077
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Ingest
        run: pnpm ingest
